<!doctype html><html lang="bs"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e"><title>Praćenje magacina</title>
<link rel="manifest" href="manifest.webmanifest">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f4f7f6;--card:#fff;--tx:#10231f;--mu:#62736f;--br:#dce5e2;--pr:#0f766e;--pr2:#0b5a54;--in:#15803d;--out:#c2410c;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0d1514;--card:#16211f;--tx:#e8f1ef;--mu:#8fa39f;--br:#26352f;--pr:#2dd4bf;--pr2:#5eead4;--in:#4ade80;--out:#fb923c}}
*{box-sizing:border-box}body{margin:0;font:16px/1.4 Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 0 0}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--pr);color:#fff;position:sticky;top:0;z-index:5}
@media(prefers-color-scheme:dark){header{background:#0f766e}}
header b{font-size:18px}header small{opacity:.85;display:block;font-size:12px}header button{background:#ffffff26;color:#fff;border:0;padding:8px 12px;border-radius:10px}
main{max-width:980px;margin:0 auto;padding:16px 16px 100px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--br);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:10px 4px;font-size:12px;font-weight:600}nav button span{display:block;font-size:20px}nav .on{color:var(--pr)}
@media(min-width:760px){nav{position:static;max-width:980px;margin:12px auto 0;border:1px solid var(--br);border-radius:14px;overflow:hidden}nav button{font-size:14px}nav button span{display:inline;margin-right:6px}main{padding-bottom:40px}}
.card{background:var(--card);border:1px solid var(--br);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px #0000000d}
label{display:block;font-size:13px;font-weight:600;color:var(--mu);margin:12px 0 4px}
input,select{width:100%;padding:12px;border:1px solid var(--br);border-radius:12px;font:inherit;background:var(--bg);color:var(--tx)}
input:focus,select:focus{outline:2px solid var(--pr);border-color:transparent}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--pr);color:#fff;font:600 16px inherit;margin-top:16px}
@media(prefers-color-scheme:dark){.btn{background:#0f766e}}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seg button{padding:14px;border-radius:12px;border:2px solid var(--br);background:var(--card);color:var(--tx);font:700 16px inherit}
.seg .in.on{border-color:var(--in);color:var(--in);background:#16a34a14}.seg .out.on{border-color:var(--out);color:var(--out);background:#ea580c14}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.big{font-size:26px;font-weight:800}.mu{color:var(--mu);font-size:13px}
.in{color:var(--in)}.out{color:var(--out)}.hint{margin-top:8px;padding:10px;border-radius:10px;background:var(--bg);font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}.chip{flex:none;padding:8px 14px;border-radius:99px;border:1px solid var(--br);background:var(--card);color:var(--tx);font-weight:600}
.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}.chip small{opacity:.7;margin-left:6px}
table{width:100%;border-collapse:collapse}td,th{padding:10px 6px;border-bottom:1px solid var(--br);text-align:left}th{font-size:12px;color:var(--mu)}td.n,th.n{text-align:right}
.wrap{overflow-x:auto}.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--br);background:var(--card);color:var(--tx);font-weight:600}.tabs .on{background:var(--pr);color:#fff}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#10231f;color:#fff;padding:12px 18px;border-radius:12px;z-index:9;display:none;max-width:90%}
.auth{max-width:420px;margin:8vh auto;padding:0 16px}.auth h1{text-align:center;color:var(--pr)}.link{background:none;border:0;color:var(--pr);font-weight:600;width:100%;margin-top:12px;padding:8px}
.hero{background:linear-gradient(135deg,var(--pr),#0b5a54);color:#fff;border:0}.hero .mu,.hero label{color:#ffffffcc}.huge{font-size:44px;font-weight:800;line-height:1.1}.huge small{font-size:18px;opacity:.8}.hero .chip{background:#ffffff26;color:#fff;border:0}
details.card summary{list-style:none;cursor:pointer}details.card summary::-webkit-details-marker{display:none}details[open]>summary{border-bottom:1px solid var(--br);padding-bottom:10px}
.tag{background:var(--bg);border:1px solid var(--br);border-radius:6px;font-size:11px;padding:1px 6px;color:var(--mu)}.x{border:0;background:none}
.grid3{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3>div:last-child:nth-child(3){grid-column:1/-1}@media(min-width:760px){.grid3{grid-template-columns:1fr 1fr 2fr}}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:20}
</style></head><body><div id="toast"></div><div id="root"></div>
<script>
const SUPABASE_URL='https://jdwoukromsnjhbzuuwmg.supabase.co', SUPABASE_KEY='sb_publishable_t06ANgBontBuGUtC_DXQCQ_jgx2XZmx';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s),root=$('#root');
const fmt=n=>Number(n||0).toLocaleString('bs-BA'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),fd=d=>d.split('-').reverse().join('.');
let me,myp=[],plants=[],customers=[],products=[],stock=[],mov=[],tab,type='in',sel={},pre={},mode='login',rg={f:'',t:'',q:''},zero=false;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3200)}
async function all(q){let o=[],i=0;for(;;){const{data,error}=await q().range(i,i+999);if(error)throw error;o=o.concat(data);if(data.length<1000)return o;i+=1000}}
const up=()=>me.role==='upravnik';
async function ens(tb,val,list,ex={}){let f=list.find(x=>x.name.toLowerCase()===val.toLowerCase());if(f)return f;const{data,error}=await sb.from(tb).insert({name:val,...ex}).select().single();if(error)throw error;list.push(data);return data}
async function init(){const{data:{session}}=await sb.auth.getSession();session?boot():authView()}
function authView(){
 root.innerHTML=`<div class="auth"><h1>📦 Praćenje magacina</h1><div class="card"><form id="f">
 <label>Korisničko ime</label><input id="em" required autocomplete="username" autocapitalize="none" autocorrect="off" placeholder="korisničko ime ili e-mail"><label>Lozinka</label><input id="pw" type="password" required autocomplete="current-password">
 <button class="btn">Prijava</button></form></div></div>`;
 $('#f').onsubmit=async e=>{e.preventDefault();const u=$('#em').value.trim().toLowerCase(),email=u.includes('@')?u:u+'@pobjeda.com',password=$('#pw').value;
  const{error}=await sb.auth.signInWithPassword({email,password});if(error)return toast('Pogrešno korisničko ime ili lozinka');boot()}}
async function boot(){try{
 const{data:{user}}=await sb.auth.getUser();
 me=(await sb.from('profiles').select('*,plants(name)').eq('id',user.id).single()).data;
 [customers,products,plants]=await Promise.all([all(()=>sb.from('customers').select('*').order('name')),all(()=>sb.from('products').select('*').order('name')),all(()=>sb.from('plants').select('*').order('name'))]);
 myp=up()?plants:((await sb.from('user_plants').select('plants(id,name)')).data||[]).map(x=>x.plants);tab=up()?'pogoni':'unos';await loadAll();shell()}catch(e){toast(e.message);authView()}}
async function loadAll(){[stock,mov]=await Promise.all([all(()=>sb.from('v_stock').select('*').order('customer')),all(()=>sb.from('movements').select('*,customers(name),products(name),plants(name)').order('date',{ascending:false}).order('created_at',{ascending:false}))]);
 if(!up()){const mid=plants.find(p=>p.is_main)?.id;stock=stock.filter(s=>s.plant_id===mid);mov=mov.filter(m=>m.plant_id===mid)}}
const tabs=()=>up()?[['pogoni','🏭','Pogoni'],['kupci','🏢','Kupci'],['proizvodi','📦','Artikli'],['otprema','🚚','Otprema'],['evid','🗓','Historija']]:[['unos','📦','Magacin'],['stanje','📊','Stanje'],['evid','🗓','Historija']];
function shell(){root.innerHTML=`<header><div><b>📦 Magacin</b><small>${esc(me.full_name||me.email)} · ${up()?'Upravnik':'Magacin'}</small></div><button id="lo">Odjava</button></header>
 <main id="v"></main><nav>${tabs().map(t=>`<button data-t="${t[0]}" class="${t[0]===tab?'on':''}"><span>${t[1]}</span>${t[2]}</button>`).join('')}</nav>`;
 $('#lo').onclick=async()=>{await sb.auth.signOut();me=null;authView()};
 document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;shell()});view()}
const view=()=>({unos:vUnos,stanje:vStanje,evid:vEvid,pogoni:()=>vGroup('plant'),kupci:()=>vGroup('customer'),proizvodi:()=>vGroup('product'),otprema:vOtprema})[tab]();
const same=(s,m)=>m.plant_id===s.plant_id&&m.customer_id===s.customer_id&&m.product_id===s.product_id&&(m.serija||'')===s.serija;
const inR=m=>(!rg.f||m.date>=rg.f)&&(!rg.t||m.date<=rg.t);
function vUnos(){const v=$('#v'),mag=plants.find(p=>p.is_main),mid=()=>mag?.id,ser=[...new Set(mov.map(m=>m.serija).filter(Boolean))],dest=plants.filter(p=>!p.is_main);
 if(!mid()){v.innerHTML='<p class="mu">Nema glavnog magacina u bazi.</p>';return}
 v.innerHTML=`<div class="card"><div class="seg"><button class="in ${type==='in'?'on':''}" data-ty="in">⬇ Ulaz</button><button class="out ${type==='out'?'on':''}" data-ty="out">⬆ Izlaz</button></div>
 <label id="dl">Datum ${type==='in'?'ulaza':'izlaza'}</label><input id="dt" type="date" value="${new Date().toISOString().slice(0,10)}">
 <label>Magacin</label><input value="Magacin" readonly>
 <div id="dw"></div>
 <label>Kupac</label><input id="cu" list="cl" placeholder="odaberi ili upiši novog"><datalist id="cl">${customers.map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist>
 <label>Šifra artikla</label><input id="co" list="pl2" placeholder="npr. LP-1"><datalist id="pl2">${products.map(p=>`<option value="${esc(p.name)}">`).join('')}</datalist>
 <label>Serija</label><input id="se" list="sl" placeholder="broj serije"><datalist id="sl">${ser.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>
 <label>Količina (kom)</label><input id="qt" type="number" inputmode="numeric" min="1">
 <label>Nalog / napomena (nije obavezno)</label><input id="nt"><div class="hint" id="h" style="display:none"></div><button class="btn" id="sv">Spremi</button></div>`;
 const low=i=>$('#'+i).value.trim().toLowerCase(),
  find=()=>stock.find(x=>x.plant_id===mid()&&x.customer.toLowerCase()===low('cu')&&x.product.toLowerCase()===low('co')&&x.serija.toLowerCase()===low('se')),
  drawDest=()=>{$('#dw').innerHTML=type==='out'?`<label>Pogon (kuda ide)</label><select id="dst">${dest.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>`:''},
  upd=()=>{const c=low('cu'),p=low('co'),s=find(),h=$('#h');if(!h)return;
   h.style.display=c&&p?'block':'none';
   h.innerHTML=type==='out'?(s&&s.stanje>0?`Na stanju u magacinu: ${fmt(s.stanje)} kom`:'<span class="out">Nema tog artikla na stanju u magacinu</span>'):`Trenutno stanje: ${fmt(s?.stanje)} kom`};
 drawDest();['cu','co','se'].forEach(i=>{const e=$('#'+i);if(e){e.oninput=upd;e.onchange=upd}});upd();
 v.querySelectorAll('[data-ty]').forEach(b=>b.onclick=()=>{type=b.dataset.ty;v.querySelectorAll('[data-ty]').forEach(x=>x.classList.toggle('on',x===b));$('#dl').textContent='Datum '+(type==='in'?'ulaza':'izlaza');drawDest();upd()});
 $('#sv').onclick=async()=>{try{const cn=$('#cu').value.trim(),pn=$('#co').value.trim(),se=$('#se').value.trim(),q=+$('#qt').value;
  if(!cn||!pn||!q)return toast('Upiši kupca, šifru artikla i količinu');
  const s=find();
  if(type==='out'){
   if(!s||s.stanje<=0)return toast('Nema tog artikla na stanju u magacinu');
   const to=$('#dst')?.value;if(!to)return toast('Odaberi pogon');
   if(q>s.stanje)return toast(`Izlaz (${fmt(q)}) je veći od stanja (${fmt(s.stanje)})`);
   const{error}=await sb.rpc('izlaz',{p_plant:mid(),p_to:to,p_customer:s.customer_id,p_product:s.product_id,p_serija:s.serija,p_qty:q,p_date:$('#dt').value,p_note:$('#nt').value.trim()||null});if(error)throw error;
   await loadAll();toast(q>=s.stanje?'✅ Skinuto sa stanja – ostalo 0 kom':`✅ Izlaz spremljen – ostalo ${fmt(s.stanje-q)} kom`);return vUnos()}
  const c=await ens('customers',cn,customers),p=await ens('products',pn,products);
  const{error}=await sb.from('movements').insert({date:$('#dt').value,plant_id:mid(),customer_id:c.id,product_id:p.id,serija:se,qty_in:q,qty_out:0,note:$('#nt').value.trim()||null});if(error)throw error;
  await loadAll();toast('✅ Spremljeno');vUnos()}catch(e){toast(e.message)}}}
function dlg(t,inf,body,go,bt,ok){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="card" style="width:min(420px,92vw)"><b>${t}</b><div class="mu">${inf}</div>${body}<button class="btn" id="tg">${bt||'Prebaci'}</button><button class="link" id="tx">Odustani</button></div>`;document.body.appendChild(o);
 $('#tx').onclick=()=>o.remove();$('#tg').onclick=async()=>{try{await go();o.remove();await loadAll();toast(ok||'✅ Prebačeno');view()}catch(e){toast(e.message)}}}
const info=s=>`${esc(s.customer)} · ${esc(s.product)}${s.serija?' · '+esc(s.serija):''} · pogon ${esc(s.plant)} · stanje ${fmt(s.stanje)} kom`,qty=s=>`<label>Količina (kom)</label><input id="tq" type="number" min="1" max="${s.stanje}" value="${s.stanje}">`;
function transfer(s){dlg('Prebaci na drugog kupca',info(s),`<label>Novi kupac</label><input id="tc" list="cl2" placeholder="odaberi ili upiši"><datalist id="cl2">${customers.filter(c=>c.id!==s.customer_id).map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist>`+qty(s),async()=>{
 const n=$('#tc').value.trim();if(!n)throw Error('Upiši kupca');const c=await ens('customers',n,customers);
 const{error}=await sb.rpc('transfer_stock',{p_plant:s.plant_id,p_product:s.product_id,p_serija:s.serija,p_from:s.customer_id,p_to:c.id,p_qty:+$('#tq').value});if(error)throw error})}
function edit(m){dlg('Ispravka unosa',`${esc(m.plants.name)} · ${esc(m.customers.name)} · ${esc(m.products.name)}${m.serija?' · '+esc(m.serija):''}${m.kind==='pogon'||m.kind==='prebacivanje'?'<br>Ispravka važi i za drugu stranu prebacivanja.':''}`,`<label>Količina (kom)</label><input id="eq" type="number" min="1" value="${m.qty_in||m.qty_out}"><label>Datum</label><input id="ed" type="date" value="${m.date}">`,async()=>{
 const{error}=await sb.rpc('ispravi_unos',{p_id:m.id,p_qty:+$('#eq').value,p_date:$('#ed').value});if(error)throw error},'Spremi ispravku','✅ Ispravljeno')}
const act=m=>up()?`<button data-e="${m.id}" class="x">✏️</button><button data-x="${m.id}" class="x">🗑</button>`:(m.kind==='promet'?`<button data-d="${m.id}" class="x">🗑</button>`:''),
 tg=m=>m.kind==='promet'?'':`<span class="tag">${{otprema:'otprema',pogon:'pogon',izlaz:'izlaz',prebacivanje:'prebačeno'}[m.kind]||m.kind}</span> `;
const hist=ms=>ms.length?`<div class="wrap"><table><tr><th>Datum ulaza</th><th>Datum izlaza</th><th class="n">Ulaz</th><th class="n">Izlaz</th><th>Napomena</th><th></th></tr>${ms.map(m=>`<tr><td>${m.qty_in?fd(m.date):''}</td><td>${m.qty_out?fd(m.date):''}</td><td class="n in">${m.qty_in?fmt(m.qty_in):''}</td><td class="n out">${m.qty_out?fmt(m.qty_out):''}</td><td>${tg(m)}${esc(m.note)}</td><td>${act(m)}</td></tr>`).join('')}</table></div>`:'<p class="mu">Nema transakcija u odabranom periodu.</p>';
function bind(){document.querySelectorAll('[data-d]').forEach(b=>b.onclick=async e=>{e.preventDefault();if(!confirm('Obrisati ovaj unos?'))return;const{error}=await sb.from('movements').delete().eq('id',b.dataset.d);if(error)return toast(error.message);await loadAll();view()});
 document.querySelectorAll('[data-tr]').forEach(b=>b.onclick=e=>{e.preventDefault();transfer(stock[+b.dataset.tr])});
 document.querySelectorAll('[data-x]').forEach(b=>b.onclick=async e=>{e.preventDefault();if(!confirm('Obrisati ovaj unos? (kod prebacivanja briše se i druga strana)'))return;const{error}=await sb.rpc('obrisi_unos',{p_id:b.dataset.x});if(error)return toast(error.message);await loadAll();toast('✅ Obrisano');view()});
 document.querySelectorAll('[data-e]').forEach(b=>b.onclick=e=>{e.preventDefault();edit(mov.find(m=>m.id===b.dataset.e))})}
const card=(s,labels)=>{labels=labels||[s.customer,s.product,s.serija?'ser. '+s.serija:''].filter(Boolean).map(esc).join(' · ');const ms=mov.filter(m=>same(s,m)&&inR(m)),i=stock.indexOf(s);
 return `<details class="card"><summary class="row"><div><b>${labels}</b><div class="mu"><span class="in">▼ ${fmt(s.qty_in)}</span> · <span class="out">▲ ${fmt(s.qty_out)}</span>${s.last_in?` · zadnji ulaz ${fd(s.last_in)}`:''}${s.last_out?` · zadnji izlaz ${fd(s.last_out)}`:''}</div></div><div class="big">${fmt(s.stanje)}</div></summary>
 <div style="margin-top:10px">${hist(ms)}${!up()&&s.stanje>0?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="chip" data-tr="${i}">🔁 Prebaci na drugog kupca</button></div>`:''}</div></details>`};
function vStanje(){const v=$('#v');v.innerHTML=`<input id="q" placeholder="🔍 Traži kupca, šifru ili seriju"><div id="l" style="margin-top:12px"></div>`;
 const draw=()=>{const q=$('#q').value.toLowerCase(),r=stock.filter(s=>s.stanje!==0&&(s.customer+s.product+s.serija).toLowerCase().includes(q));
  $('#l').innerHTML=r.map(s=>card(s)).join('')||'<p class="mu">Nema podataka.</p>';bind()};
 $('#q').oninput=draw;draw()}
function vEvid(){const v=$('#v');
 v.innerHTML=`<div class="card"><div class="grid3"><div><label>Od</label><input id="f" type="date" value="${rg.f}"></div><div><label>Do</label><input id="t" type="date" value="${rg.t}"></div><div><label>Traži</label><input id="q" value="${esc(rg.q)}" placeholder="kupac, proizvod…"></div></div></div><div id="l"></div>`;
 const draw=()=>{const q=rg.q.toLowerCase(),d=mov.filter(m=>inR(m)&&(m.customers.name+m.products.name+m.serija+m.plants.name+(m.note||'')).toLowerCase().includes(q)),days=[...new Set(d.map(m=>m.date))];
  $('#l').innerHTML=days.map(day=>{const ms=d.filter(m=>m.date===day),ui=ms.filter(m=>m.kind!=='prebacivanje');return `<div class="card"><div class="row"><b>${fd(day)}</b><span class="mu"><span class="in">▼ ${fmt(ui.reduce((a,m)=>a+m.qty_in,0))}</span> · <span class="out">▲ ${fmt(ui.reduce((a,m)=>a+m.qty_out,0))}</span></span></div><div class="wrap"><table>${ms.map(m=>`<tr><td>${up()?esc(m.plants.name)+'<div class="mu">'+esc(m.customers.name)+'</div>':esc(m.customers.name)}</td><td>${esc(m.products.name)}${m.serija?' · '+esc(m.serija):''}${m.note?`<div class="mu">${m.kind==='izlaz'?'🚚 ':m.kind==='pogon'||m.kind==='prebacivanje'?'🔁 ':''}${esc(m.note)}</div>`:''}</td><td class="n in">${m.qty_in?'+'+fmt(m.qty_in):''}</td><td class="n out">${m.qty_out?'−'+fmt(m.qty_out):''}</td><td>${act(m)}</td></tr>`).join('')}</table></div></div>`}).join('')||'<p class="mu">Nema transakcija.</p>';bind()};
 ['f','t','q'].forEach(i=>$('#'+i).oninput=e=>{rg[i]=e.target.value;draw()});draw()}
function vGroup(dim){const v=$('#v'),cols={plant:['customer','product','serija'],customer:['plant','product','serija'],product:['plant','customer','serija']}[dim];
 const ok=s=>zero||s.stanje!==0,keys=[...new Set(stock.filter(ok).map(s=>s[dim]))].sort(),tot=k=>stock.filter(s=>s[dim]===k).reduce((a,s)=>a+s.stanje,0);
 if(!keys.includes(sel[dim]))sel[dim]=keys[0];const rows=stock.filter(s=>s[dim]===sel[dim]&&ok(s));
 v.innerHTML=keys.length?`<div class="chips">${keys.map(k=>`<button class="chip ${k===sel[dim]?'on':''}" data-k="${esc(k)}">${esc(k)}<small>${fmt(tot(k))}</small></button>`).join('')}</div>
 <div class="card hero"><div class="mu">TRENUTNO STANJE · ${esc(sel[dim])}</div><div class="huge">${fmt(tot(sel[dim]))} <small>kom</small></div>
 <div class="row" style="margin-top:8px"><label style="margin:0"><input type="checkbox" id="z" ${zero?'checked':''} style="width:auto"> prikaži i nulta stanja</label><button class="chip" id="ex">⬇ CSV</button></div></div>
 <div class="card"><div class="grid3" style="grid-template-columns:1fr 1fr"><div><label>Historija od</label><input id="f" type="date" value="${rg.f}"></div><div><label>do</label><input id="t" type="date" value="${rg.t}"></div></div><div class="mu" style="margin-top:6px">Stanje je uvijek trenutno; period filtrira samo prikaz transakcija (otvori karticu).</div></div>
 ${rows.map(s=>card(s,cols.map(c=>s[c]).filter(Boolean).map(esc).join(' · '))).join('')}`:'<p class="mu">Još nema stanja.</p>';
 bind();v.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{sel[dim]=b.dataset.k;vGroup(dim)});
 if(!keys.length)return;$('#z').onchange=e=>{zero=e.target.checked;vGroup(dim)};['f','t'].forEach(i=>$('#'+i).onchange=e=>{rg[i]=e.target.value;vGroup(dim)});
 $('#ex').onclick=()=>{const l=[['Pogon','Kupac','Šifra','Serija','Ulaz','Izlaz','Stanje'],...rows.map(s=>[s.plant,s.customer,s.product,s.serija,s.qty_in,s.qty_out,s.stanje])];
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+l.map(r=>r.map(x=>`"${String(x??'').replace(/"/g,'""')}"`).join(';')).join('\n')],{type:'text/csv'}));a.download=`stanje-${sel[dim]}.csv`;a.click()}}

 v.innerHTML=`<div class="card"><div class="grid3" style="grid-template-columns:1fr 1fr"><div><label>Od</label><input id="f" type="date" value="${rg.f}"></div><div><label>Do</label><input id="t" type="date" value="${rg.t}"></div></div></div><div id="l"></div>`;
 const draw=()=>{const d=mov.filter(m=>(m.kind==='otprema'||m.kind==='izlaz')&&inR(m)),tot=d.reduce((a,m)=>a+m.qty_out,0);
