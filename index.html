 v.innerHTML=`<div class="card"><div class="grid3"><div><label>Od</label><input id="f" type="date" value="${rg.f}"></div><div><label>Do</label><input id="t" type="date" value="${rg.t}"></div><div><label>Traži</label><input id="q" value="${esc(rg.q)}" placeholder="kupac, proizvod, serija, napomena…"></div></div>
 <div class="grid3" style="margin-top:2px"><div><label>Kupac</label><select id="fcu">${op('','Svi kupci')}${customers.map(c=>op(c.id,c.name)).join('')}</select></div><div><label>Proizvod</label><select id="fpr">${op('','Svi proizvodi')}${(mgr()?products:prodsFor(storeId())).map(p=>op(p.id,p.name)).join('')}</select></div><div><label>Odredište</label><select id="fpl">${op('','Sva odredišta')}${pls.map(x=>op(x,x)).join('')}</select></div></div>
 <div class="grid3" style="margin-top:2px">${mgr()?`<div><label>Magacin (odakle)</label><select id="fst">${op('','Svi magacini')}${sts.map(s=>op(s.id,s.name)).join('')}</select></div>`:''}<div><label>Tip</label><select id="fkd">${op('','Sve transakcije')}${op('in','Samo ulazi')}${op('out','Samo izlazi')}</select></div><div style="display:flex;align-items:flex-end;gap:8px"><button class="chip" id="clr" style="flex:1">✕ Očisti filtere</button><button class="chip" id="ex" style="flex:1">⬇ CSV</button></div></div></div><div id="l"></div>`;
 $('#fcu').value=hf.cu;$('#fpr').value=hf.pr;$('#fpl').value=hf.pl;$('#fkd').value=hf.kd;if($('#fst'))$('#fst').value=hf.st;
 let cur=[];
 const th=(k,l,cls)=>`<th class="${cls||''}"><button class="x" data-s="${k}" style="font:inherit;color:inherit;padding:0;text-align:${cls?'right':'left'}">${l}${srt.k===k?(srt.d>0?' ▲':' ▼'):''}</button></th>`;
 const draw=()=>{const q=rg.q.trim().toLowerCase();
  let d=mov.filter(m=>inR(m));
  if(hf.cu)d=d.filter(m=>m.customer_id===hf.cu);
  if(hf.pr)d=d.filter(m=>m.product_id===hf.pr);
  if(hf.pl)d=d.filter(m=>destOf(m)===hf.pl);
  if(hf.st)d=d.filter(m=>m.plant_id===hf.st);
  if(hf.kd==='in')d=d.filter(m=>m.qty_in>0);else if(hf.kd==='out')d=d.filter(m=>m.qty_out>0);
  if(q)d=d.filter(m=>[m.customers?.name,m.products?.name,m.serija,m.note,m.plants?.name,destOf(m)].join(' ').toLowerCase().includes(q));
  sortMov(d,srt.k,srt.d);cur=d;
  const ti=d.reduce((a,m)=>a+m.qty_in,0),to=d.reduce((a,m)=>a+m.qty_out,0),n=d.length;
  $('#l').innerHTML=`<div class="card hero"><div class="mu">FILTRIRANO · ${n} ${n%10===1&&n%100!==11?'transakcija':(n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)?'transakcije':'transakcija')}</div><div class="row" style="margin-top:8px"><div><div class="mu">Ulaz</div><div class="in" style="font-size:30px;font-weight:800">▼ ${fmt(ti)}</div></div><div style="text-align:right"><div class="mu">Izlaz</div><div class="out" style="font-size:30px;font-weight:800">▲ ${fmt(to)}</div></div></div></div>
  <div class="card"><div class="mu" style="padding:0 6px 8px">Klikni na zaglavlje kolone za sortiranje ▼/▲.</div><div class="wrap"><table><tr>${th('date','Datum')}${th('iz','Iz')}${th('u','Odredište')}${th('cu','Kupac')}${th('pr','Proizvod')}${th('in','Ulaz','n')}${th('out','Izlaz','n')}<th>Napomena</th><th></th></tr>
  ${d.map(m=>`<tr><td style="white-space:nowrap">${fd(m.date)}</td><td>${esc(m.plants?.name||'')}</td><td>${destOf(m)?'<b>'+esc(destOf(m))+'</b>':'<span class="mu">—</span>'}</td><td>${esc(m.customers?.name||'')}</td><td>${esc(m.products?.name||'')}${m.serija?'<div class="mu">ser. '+esc(m.serija)+'</div>':''}${m.status==='cekanje'?' <span class="tag">na čekanju</span>':''}</td><td class="n in">${m.qty_in?'+'+fmt(m.qty_in):''}</td><td class="n out">${m.qty_out?'−'+fmt(m.qty_out):''}</td><td style="max-width:220px;font-size:13px">${esc(m.note||'')}</td><td style="white-space:nowrap">${act(m)}</td></tr>`).join('')}</table></div>${n?'':'<p class="mu">Nema transakcija za ovaj filter.</p>'}</div>`;
  bind();
  $('#l').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const k=b.dataset.s;srt=srt.k===k?{k,d:-srt.d}:{k,d:k==='date'?-1:1};draw()})};
 ['f','t','q'].forEach(i=>$('#'+i).oninput=e=>{rg[i]=e.target.value;draw()});
 $('#fcu').onchange=e=>{hf.cu=e.target.value;draw()};$('#fpr').onchange=e=>{hf.pr=e.target.value;draw()};
 $('#fpl').onchange=e=>{hf.pl=e.target.value;draw()};$('#fkd').onchange=e=>{hf.kd=e.target.value;draw()};
 const fe=$('#fst');if(fe)fe.onchange=e=>{hf.st=e.target.value;draw()};
 $('#clr').onclick=()=>{rg={f:'',t:'',q:''};hf={cu:'',pr:'',pl:'',kd:'',st:''};srt={k:'date',d:-1};vEvid()};
 $('#ex').onclick=()=>{const l=[['Datum','Iz','Odredište','Kupac','Proizvod','Serija','Ulaz','Izlaz','Napomena'],...cur.map(m=>[m.date,m.plants?.name||'',destOf(m),m.customers?.name||'',m.products?.name||'',m.serija||'',m.qty_in,m.qty_out,m.note||''])];
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+l.map(r=>r.map(y=>`"${String(y??'').replace(/"/g,'""')}"`).join(';')).join('\n')],{type:'text/csv'}));a.download='historija.csv';a.click()};
 draw()}
function vGroup(dim){const v=$('#v'),cols={plant:['customer','product','serija'],customer:['plant','product','serija'],product:['plant','customer','serija']}[dim];
 const ok=s=>zero||s.stanje!==0,keys=[...new Set(stock.filter(ok).map(s=>s[dim]))].sort(),tot=k=>stock.filter(s=>s[dim]===k).reduce((a,s)=>a+s.stanje,0);
 if(!keys.includes(sel[dim]))sel[dim]=keys[0];const rows=stock.filter(s=>s[dim]===sel[dim]&&ok(s));
 v.innerHTML=keys.length?`<div class="chips">${keys.map(k=>`<button class="chip ${k===sel[dim]?'on':''}" data-k="${esc(k)}">${esc(k)}<small>${fmt(tot(k))}</small></button>`).join('')}</div>
 <div class="card hero"><div class="mu">TRENUTNO STANJE · ${esc(sel[dim])}</div><div class="huge">${fmt(tot(sel[dim]))} <small>kom</small></div>
 <div class="row" style="margin-top:8px"><label style="margin:0"><input type="checkbox" id="z" ${zero?'checked':''} style="width:auto"> prikaži i nulta stanja</label><button class="chip" id="ex">⬇ CSV</button></div></div>
 <div class="card"><div class="grid3" style="grid-template-columns:1fr 1fr"><div><label>Historija od</label><input id="f" type="date" value="${rg.f}"></div><div><label>do</label><input id="t" type="date" value="${rg.t}"></div></div><div class="mu" style="margin-top:6px">Stanje je uvijek trenutno; period filtrira samo prikaz transakcija (otvori karticu).</div></div>
 ${rows.map(s=>card(s,cols.map(c=>s[c]).filter(Boolean).map(esc).join(' · '))).join('')}`:'<p class="mu">Još nema stanja.</p>';
 bind();v.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{sel[dim]=b.dataset.k;vGroup(dim)});
 if(!keys.length)return;$('#z').onchange=e=>{zero=e.target.checked;vGroup(dim)};['f','t'].forEach(i=>$('#'+i).onchange=e=>{rg[i]=e.target.value;vGroup(dim)});
 $('#ex').onclick=()=>{const l=[['Pogon','Kupac','Šifra','Serija','Ulaz','Izlaz','Stanje'],...rows.map(s=>[s.plant,s.customer,s.product,s.serija,s.qty_in,s.qty_out,s.stanje])];
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+l.map(r=>r.map(x=>`"${String(x??'').replace(/"/g,'""')}"`).join(';')).join('\n')],{type:'text/csv'}));a.download=`stanje-${sel[dim]}.csv`;a.click()}}
function vOtprema(){const v=$('#v');
 v.innerHTML=`<div class="card"><div class="grid3" style="grid-template-columns:1fr 1fr"><div><label>Od</label><input id="f" type="date" value="${rg.f}"></div><div><label>Do</label><input id="t" type="date" value="${rg.t}"></div></div></div><div id="l"></div>`;
 const draw=()=>{const d=mov.filter(m=>(m.kind==='otprema'||m.kind==='izlaz')&&inR(m)),tot=d.reduce((a,m)=>a+m.qty_out,0);
  $('#l').innerHTML=`<div class="card hero"><div class="mu">IZLAZI I OTPREMA</div><div class="huge">${fmt(tot)} <small>kom</small></div></div>`+(d.map(m=>`<div class="card"><div class="row"><div><b>${fd(m.date)}</b> · ${esc(m.plants?.name||'')}<div class="mu">${esc(m.customers?.name||'')} · ${esc(m.products?.name||'')}${m.serija?' · '+esc(m.serija):''}${m.kind==='izlaz'?' · <span class="tag">izlaz</span>':''}${m.note?`<div>${esc(m.note)}</div>`:''}</div></div><div><span class="big out">${fmt(m.qty_out)}</span>${act(m)}</div></div></div>`).join('')||'<p class="mu">Nema izlaza u odabranom periodu.</p>');bind()};
 ['f','t'].forEach(i=>$('#'+i).onchange=e=>{rg[i]=e.target.value;draw()});draw()}
sb.auth.onAuthStateChange(e=>{if(e==='SIGNED_OUT')authView()});init();
</script></body></html>
